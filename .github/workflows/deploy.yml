name: Deploy Contracts to Testnet
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}
      # Installs cargo-binstall instantly
      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      # Installs stellar-cli in 3 seconds using the precompiled binary
      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli
      # Build standard wasm and optimize it
      - name: Build contracts
        run: |
          sed -i 's/crate-type = \["rlib"\]/crate-type = \["cdylib", "rlib"\]/g' contracts/campaign/Cargo.toml
          sed -i 's/crate-type = \["rlib"\]/crate-type = \["cdylib", "rlib"\]/g' contracts/factory/Cargo.toml
          cargo build --target wasm32v1-none --release
          stellar contract optimize --wasm target/wasm32v1-none/release/campaign_contract.wasm
          stellar contract optimize --wasm target/wasm32v1-none/release/factory_contract.wasm
          sed -i 's/crate-type = \["cdylib", "rlib"\]/crate-type = \["rlib"\]/g' contracts/campaign/Cargo.toml
          sed -i 's/crate-type = \["cdylib", "rlib"\]/crate-type = \["rlib"\]/g' contracts/factory/Cargo.toml
      # Deploy the optimized contracts
      - name: Deploy to Testnet
        run: |
          echo "Generating identities..."
          stellar keys generate deployer --network testnet
          stellar keys fund deployer --network testnet
          
          echo "Installing Campaign WASM..."
          CAMPAIGN_HASH=$(stellar contract install \
            --wasm target/wasm32v1-none/release/campaign_contract.optimized.wasm \
            --source deployer \
            --network testnet)
          echo "Campaign WASM Hash: $CAMPAIGN_HASH"
          
          echo "Deploying Factory Contract..."
          FACTORY_ID=$(stellar contract deploy \
            --wasm target/wasm32v1-none/release/factory_contract.optimized.wasm \
            --source deployer \
            --network testnet)
          echo "Factory Contract Address: $FACTORY_ID"
          
          echo "Initializing Factory Contract..."
          stellar contract invoke \
            --id "$FACTORY_ID" \
            --source deployer \
            --network testnet \
            -- init \
            --wasm_hash "$CAMPAIGN_HASH"
          echo "Factory contract initialized successfully!"
          
          echo "Fetching Test Token (Native XLM asset) ID..."
          TOKEN_ID=$(stellar contract id asset --asset native --network testnet)
          echo "Native Token ID is: $TOKEN_ID"
